server:
  port: ${SERVER_PORT:8088}

spring:
  config:
    import: optional:classpath:darkfleet-security.yml
  application:
    name: map-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # every start rewinds the topics itself (GatewayKafkaListeners), so nothing is committed
      auto-offset-reset: earliest
      # Track & Detection writes in transactions; never read what an aborted one wrote
      isolation-level: read-committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      type: batch
      ack-mode: manual
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        # snapshot SSE broadcast, SSE heartbeat, expired vessel eviction
        size: 3

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

darkfleet:
  security:
    public-get-paths:
      - /api/v1/map/**
  gateway:
    replay: false
    vessel-expiry: 1h
    static-expiry: 7d
    history-window: 7d
    snapshot-interval: 5s
    feed-stale-after: 2m
    intelligence-url: ${DARKFLEET_INTELLIGENCE_URL:http://localhost:8086}
    intelligence-api-key: ${DARKFLEET_GATEWAY_API_KEY}
    intelligence-timeout: 15s
    wikimedia-api-url: ${DARKFLEET_WIKIMEDIA_API_URL:https://commons.wikimedia.org/w/api.php}
    wikimedia-timeout: 3s
    photo-cache-ttl: 24h

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
