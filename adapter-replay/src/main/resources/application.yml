server:
  port: ${SERVER_PORT:8083}

spring:
  config:
    import: optional:classpath:darkfleet-security.yml
  application:
    name: adapter-replay
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

darkfleet:
  security:
    public-get-paths:
      - /api/v1/adapter/replay/status
  replay:
    # Directory with DMA files (aisdk-YYYY-MM-DD.zip or .csv) from http://aisdata.ais.dk
    data-dir: ${DARKFLEET_REPLAY_DATA_DIR:/data/dma}
