server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: adapter-digitraffic
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

darkfleet:
  digitraffic:
    mqtt-url: ${DARKFLEET_DIGITRAFFIC_MQTT_URL:wss://meri.digitraffic.fi:443/mqtt}
    rest-locations-url: ${DARKFLEET_DIGITRAFFIC_REST_URL:https://meri.digitraffic.fi/api/ais/v1/locations}
    auto-connect: ${DARKFLEET_DIGITRAFFIC_AUTO_CONNECT:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
