server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    import: optional:classpath:darkfleet-security.yml
  application:
    name: adapter-digitraffic
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

darkfleet:
  feed:
    health-interval: 30s
  security:
    public-get-paths:
      - /api/v1/adapter/digitraffic/status
  digitraffic:
    mqtt-url: ${DARKFLEET_DIGITRAFFIC_MQTT_URL:wss://meri.digitraffic.fi:443/mqtt}
    auto-connect: ${DARKFLEET_DIGITRAFFIC_AUTO_CONNECT:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
