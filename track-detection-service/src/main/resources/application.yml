server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: track-detection-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: darkfleet-track-detection
      properties:
        processing.guarantee: exactly_once_v2
        # A message that can't be read is logged and skipped instead of stopping detection.
        deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

darkfleet:
  detection:
    mode: live
    check-interval: 1m
    feed-stale-after: 2m
    max-clock-skew: 5m
    track-point-interval: 1m
    track-turn-degrees: 20
    track-speed-change-knots: 3
    static-refresh: 24h
    forget-after: 48h
    episode-break: 30m
    coverage-grace: 10m
    # The thresholds in force until an analyst approves a rule set (rules.approved) are the shared
    # baseline in darkfleet-common (darkfleet/detection-rules-baseline.json), which Vessel Intelligence
    # reads too. Its encounter values follow Global Fishing Watch's published encounter definition
    # (500 m, below 2 kn, at least 2 h).
