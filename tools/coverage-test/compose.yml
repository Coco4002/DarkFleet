# Coverage test: Kafka + the two live adapters, recording ais.raw for 24-48 h.
# Kafka itself is the recorder (7-day retention); export.sh dumps the topic to a file afterwards.
#   cd tools/coverage-test
#   docker compose up -d --build
# WARNING: while a recording is running, do not run "docker compose up" here after changing this file:
# it would recreate the Kafka container. Run export.sh first.
name: darkfleet-coverage

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      # Without this the image writes to /tmp inside the container and the volume stays empty.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: zstd
      KAFKA_HEAP_OPTS: "-Xms768m -Xmx768m"
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    logging: *logging

  adapter-aisstream:
    build:
      context: ../..
      args:
        MODULE: adapter-aisstream
    image: darkfleet/adapter-aisstream:coverage-test
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DARKFLEET_AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:?set AISSTREAM_API_KEY in tools/coverage-test/.env}
      DARKFLEET_AISSTREAM_AUTO_CONNECT: "true"
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 512m
    logging: *logging

  adapter-digitraffic:
    build:
      context: ../..
      args:
        MODULE: adapter-digitraffic
    image: darkfleet/adapter-digitraffic:coverage-test
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DARKFLEET_DIGITRAFFIC_AUTO_CONNECT: "true"
    ports:
      - "127.0.0.1:8082:8082"
    mem_limit: 512m
    logging: *logging

  # Polls both adapters' /status once a minute into data/status.jsonl (connection state, counters).
  status-poller:
    image: curlimages/curl:8.17.0
    restart: unless-stopped
    depends_on:
      - adapter-aisstream
      - adapter-digitraffic
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          for url in http://adapter-aisstream:8081/api/v1/adapter/aisstream/status http://adapter-digitraffic:8082/api/v1/adapter/digitraffic/status; do
            body=$$(curl -s -m 10 "$$url" || true)
            [ -z "$$body" ] && body=null
            printf '{"polledAt":"%s","url":"%s","status":%s}\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$url" "$$body" >> /data/status.jsonl
          done
          sleep 60
        done
    logging: *logging

volumes:
  kafka-data:
