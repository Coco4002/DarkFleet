server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:classpath:darkfleet-security.yml
  application:
    name: adapter-aisstream
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

darkfleet:
  security:
    public-get-paths:
      - /api/v1/adapter/aisstream/status
  aisstream:
    ws-url: ${DARKFLEET_AISSTREAM_WS_URL:wss://stream.aisstream.io/v0/stream}
    api-key: ${DARKFLEET_AISSTREAM_API_KEY:}
    auto-connect: ${DARKFLEET_AISSTREAM_AUTO_CONNECT:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
