server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: adapter-aisstream
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

darkfleet:
  aisstream:
    ws-url: ${DARKFLEET_AISSTREAM_WS_URL:wss://stream.aisstream.io/v0/stream}
    api-key: ${DARKFLEET_AISSTREAM_API_KEY:}
    auto-connect: ${DARKFLEET_AISSTREAM_AUTO_CONNECT:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
